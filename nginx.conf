# 加到你現有的 nginx 設定裡（或 sites-enabled/upload.pg72.tw.conf）

server {
    listen 80;
    server_name upload.pg72.tw;

    # Cloudflare 處理 HTTPS，這裡只需要 HTTP
    # 如果想限制只接受 Cloudflare 的 IP，可取消以下區塊的註解：
    # include /etc/nginx/cloudflare-ips.conf;  # 見下方說明

    # 每個 chunk 最大 12MB（比 max_chunk_size_bytes 多一點點 buffer）
    client_max_body_size 12m;

    # 不要緩衝上傳，直接串流到後端（chunked upload 必要）
    proxy_request_buffering off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 把 Cloudflare Access 的 header 透傳給後端
        proxy_set_header   Cf-Access-Jwt-Assertion           $http_cf_access_jwt_assertion;
        proxy_set_header   Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    }
}

