<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload | 安全、快速的檔案上傳</title>
  <meta name="description" content="使用限時上傳碼或 QR Code，安全上傳大型檔案給 PG72。" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#050506" />
  <link rel="canonical" href="https://upload.pg72.tw/" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:site_name" content="PG72 Upload" />
  <meta property="og:title" content="PG72 Upload | 安全、快速的檔案上傳" />
  <meta property="og:description" content="使用限時上傳碼或 QR Code，安全上傳大型檔案。" />
  <meta property="og:url" content="https://upload.pg72.tw/" />
  <meta property="og:image" content="https://upload.pg72.tw/og-preview.png" />
  <meta property="og:image:secure_url" content="https://upload.pg72.tw/og-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PG72 Upload 安全檔案上傳服務" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PG72 Upload | 安全、快速的檔案上傳" />
  <meta name="twitter:description" content="使用限時上傳碼或 QR Code，安全上傳大型檔案。" />
  <meta name="twitter:image" content="https://upload.pg72.tw/og-preview.png" />
  <meta name="twitter:image:alt" content="PG72 Upload 安全檔案上傳服務" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ── Code entry ─────────────────────────────────────────────────────── -->
<div class="card" id="code-section">
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <span>Upload</span>
  </div>

  <div id="code-alert" class="alert"></div>

  <label for="code-input">上傳碼</label>
  <input
    type="text"
    id="code-input"
    placeholder="輸入 16 位上傳碼"
    maxlength="16"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="characters"
    inputmode="text"
    spellcheck="false"
  />

  <div class="btn-group">
    <button class="btn btn-primary" id="validate-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      驗證並上傳
    </button>
    <button class="btn btn-outline" id="scan-btn" style="width:auto;padding:13px 16px" title="掃描 QR Code">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h2v2h-2zM18 14h2M18 18h2v2h-2zM14 18v2"/>
      </svg>
      <span class="scan-label">掃碼</span>
    </button>
  </div>

  <div id="qr-scanner-wrap">
    <video id="qr-video" autoplay muted playsinline></video>
    <div id="qr-overlay"></div>
  </div>

  <p style="text-align:center;font-size:.8rem;margin-top:24px;color:var(--text-3)">
    需要上傳碼才能使用此服務
  </p>
</div>

<!-- ── Upload zone ────────────────────────────────────────────────────── -->
<div class="card" id="upload-section" style="display:none">
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <span>Upload</span>
  </div>

  <div id="upload-alert" class="alert"></div>

  <div id="session-info"></div>

  <div class="dropzone" id="dropzone">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>拖曳檔案到這裡</p>
    <small>點擊或拖曳・支援任意格式</small>
    <input type="file" id="file-input" multiple hidden />
  </div>

  <div class="file-list" id="file-list"></div>

  <button class="btn btn-primary" id="upload-btn" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    上傳所有檔案
  </button>
</div>

<script src="/vendor/jsqr/jsQR-1.4.0.js"></script>
<script src="/js/upload.js"></script>
</body>
</html>
