<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- Code entry section -->
<div class="card" id="code-section">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <span>上傳</span>
  </div>

  <div id="code-alert" class="alert"></div>

  <label for="code-input">輸入上傳碼</label>
  <input
    type="text"
    id="code-input"
    placeholder="XXXX XXXX XXXX XXXX"
    maxlength="16"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
  />

  <div class="btn-group">
    <button class="btn btn-primary" id="validate-btn">開始上傳</button>
    <button class="btn btn-outline" id="scan-btn" style="width:auto;padding:12px 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/>
        <rect x="3" y="16" width="5" height="5"/>
        <path d="M21 16h-3a2 2 0 0 0-2 2v3m-4-11h.01M12 21h.01M18 12h.01M21 12h.01M12 12h.01"/>
      </svg>
      掃描 QR Code
    </button>
  </div>

  <div id="qr-scanner-wrap">
    <video id="qr-video" autoplay muted playsinline></video>
    <div id="qr-overlay"></div>
  </div>
</div>

<!-- Upload section (shown after code validation) -->
<div class="card" id="upload-section" style="display:none">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <span>上傳檔案</span>
  </div>

  <div id="upload-alert" class="alert"></div>

  <p id="session-info" style="font-size:.8125rem;color:var(--text-2);margin-bottom:20px;font-family:monospace"></p>

  <div class="dropzone" id="dropzone">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>拖曳檔案到這裡，或點擊選擇</p>
    <small>支援任意檔案格式</small>
    <input type="file" id="file-input" multiple hidden />
  </div>

  <div class="file-list" id="file-list"></div>

  <button class="btn btn-primary" id="upload-btn" disabled>上傳所有檔案</button>
</div>

<!-- jsQR for QR scanning -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="/js/upload.js"></script>
</body>
</html>
